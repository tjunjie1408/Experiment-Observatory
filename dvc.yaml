stages:
  prepare-auto-mpg:
    cmd: >-
      uv run observatory prepare-dataset datasets/auto-mpg/raw/auto-mpg.data
      datasets/auto-mpg/processed/weight-mpg.csv
    deps:
      - datasets/auto-mpg/raw/auto-mpg.data
      - src/observatory/datasets/tabular/auto_mpg.py
    outs:
      - datasets/auto-mpg/processed/weight-mpg.csv
  prepare-wdbc:
    cmd: >-
      uv run --locked observatory prepare-wdbc datasets/breast-cancer/versions/1.0.0.yaml
      datasets/breast-cancer/processed
    deps:
      - datasets/breast-cancer/raw/wdbc.data
      - datasets/breast-cancer/raw/wdbc.names
      - datasets/breast-cancer/versions/1.0.0.yaml
      - src/observatory/datasets/tabular/breast_cancer.py
      - src/observatory/cli.py
      - pyproject.toml
      - uv.lock
    outs:
      - datasets/breast-cancer/processed
